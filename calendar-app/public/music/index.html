<p id="music-status" class="message" role="status" aria-live="polite">正在加载音乐库…</p>
<section id="music-app" hidden><div class="music-layout"><section class="card"><h2>播放选择</h2><p class="small">选择随账号保存，在 GaryHub 的粒子页面生效。点击顶部唱片播放或暂停。</p><div id="music-list"></div></section>
<aside><section class="card"><h2>存储用量</h2><p id="music-usage"></p><p id="music-access" class="small"></p><p class="small">MP3 存放在独立云存储；每首最多 20 MiB，每人最多 10 首、合计 100 MiB。</p></section>
<form id="music-upload" class="card" hidden><h2>上传音乐</h2><label for="music-file">选择 MP3</label><input id="music-file" type="file" accept=".mp3,audio/mpeg" required><button id="music-upload-button" class="primary" type="submit">上传至个人音乐库</button><p class="small">仅支持有效 MP3。上传完成后，在左侧选择歌曲。</p></form></aside></div></section>
