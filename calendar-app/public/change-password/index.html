<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改密码 · GaryHub</title><script src="/theme.js"></script><link rel="stylesheet" href="/calendar-ui.css"><style>.password-card{max-width:480px;margin:50px auto;padding:30px}input{box-sizing:border-box;width:100%}.password-card .field{margin:18px 0}.password-card button{margin-top:14px}</style><script src="/i18n/dictionary.js"></script><script src="/i18n/i18n.js"></script><link rel="stylesheet" href="/i18n/i18n.css"></head><body><nav class="site-nav"><a class="brand" href="/">Gary<span>Hub.</span></a><a href="/login/">登录</a></nav><main class="page"><form id="passwordForm" class="card password-card" hidden><span class="eyebrow">ACCOUNT SECURITY</span><h1>修改密码</h1><p id="passwordHint"></p><div class="field"><label for="currentPassword">当前密码 / 管理员提供的临时密码</label><input type="password" id="currentPassword" autocomplete="current-password" maxlength="128" required></div><div class="field"><label for="newPassword">新密码（10–128 个字符）</label><input type="password" id="newPassword" autocomplete="new-password" minlength="10" maxlength="128" required></div><div class="field"><label for="confirmPassword">再次输入新密码</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" maxlength="128" required></div><button id="savePassword" class="primary">保存新密码</button><button id="logoutPassword" class="secondary" type="button">退出登录</button><p id="passwordMessage" role="status"></p></form><p id="pageMessage" role="status">正在确认账号…</p></main><script src="/change-password/password.js"></script></body></html>
