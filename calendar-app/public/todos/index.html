<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待办清单 · GaryHub</title><script src="/theme.js"></script><link rel="stylesheet" href="/calendar-ui.css"><link rel="stylesheet" href="/todos/todos.css"><script src="/i18n/dictionary.js"></script><script src="/i18n/i18n.js"></script><link rel="stylesheet" href="/i18n/i18n.css"><script src="/i18n/dictionary.js"></script><script src="/i18n/i18n.js"></script><link rel="stylesheet" href="/i18n/i18n.css"></head>
<body><canvas id="sky" aria-hidden="true"></canvas><nav class="site-nav"><a class="brand" href="https://tools.garyhub.uk">Gary<span>Hub.</span></a><div class="nav-links"><a href="/">Calendar</a><a href="/journal/">日记</a><a href="/health-records/">健康</a><a href="/ledger/">记账</a><a href="/todos/" aria-current="page">待办清单</a><button type="button" class="theme icon-button" aria-label="切换明暗主题">◐</button><span id="todo-user" data-i18n-ignore></span><button id="todo-logout" class="text-button" type="button">退出</button></div></nav>
<main class="page todo-page"><div class="page-hero"><div><span class="eyebrow">A LITTLE AT A TIME</span><h1>待办清单<span class="title-dot">.</span></h1><p>不设期限，把想做的事慢慢完成。</p></div><div class="todo-overview"><strong id="todo-count">0 / 0</strong><span>已完成 / 全部</span></div></div>
<p id="todo-status" class="message" role="status">正在加载待办…</p><section id="todo-app" hidden><form id="todo-add" class="card todo-add"><label for="todo-title">新的待办</label><div class="todo-add-row"><input id="todo-title" maxlength="160" required placeholder="想做什么？"><button class="primary" type="submit">＋ 新增待办</button></div></form>
<div class="todo-toolbar"><p>拖动左侧手柄调整顺序；点击箭头展开子要点。</p><div><button id="todo-download" class="secondary compact-button" type="button">下载草稿</button><button id="todo-reload" class="secondary compact-button" type="button">重新加载</button></div></div>
<p id="todo-empty" class="card empty-state" hidden>清单还是空的，先记下一件想做的事。</p><section id="todo-list" aria-label="待办列表"></section><p class="small todo-limits">每个账号最多 300 条待办，每条最多 100 个子要点。</p></section>
<footer><span>GARYHUB / ONE THING AT A TIME.</span><a href="/">返回 Calendar →</a></footer></main>
<dialog id="todo-dialog"><form id="todo-edit"><h2 id="todo-edit-heading">编辑待办</h2><label for="todo-edit-text">内容</label><textarea id="todo-edit-text" maxlength="1000" required rows="4"></textarea><div class="btn-row"><button id="todo-edit-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<div id="todo-live" class="sr-only" aria-live="polite"></div><script src="/ambient.js"></script><script src="/todos/todos.js"></script></body></html>
