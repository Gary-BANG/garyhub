<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康记录 · GaryHub</title><script src="/theme.js"></script><link rel="stylesheet" href="/calendar-ui.css"><script src="/i18n/dictionary.js"></script><script src="/i18n/i18n.js"></script><link rel="stylesheet" href="/i18n/i18n.css"></head><body><canvas id="sky" aria-hidden="true"></canvas><nav class="site-nav"><a class="brand" href="https://tools.garyhub.uk">Gary<span>Hub.</span></a><div class="nav-links"><a href="/">Calendar</a><a href="/journal/">日记</a><a href="/health-records/">健康</a><button type="button" class="theme icon-button" aria-label="切换明暗主题">◐</button><span id="currentUserText" class="user-name"></span><button id="logoutBtn" class="text-button" type="button">退出</button></div></nav><main class="page"><div class="page-hero"><div><span class="eyebrow">SMALL STEPS. A HEALTHIER YOU.</span><h1>Health<span class="title-dot">.</span></h1><p>记录日常，也看见自己的变化。</p></div><a class="text-link" href="/">← 返回日历</a></div><p id="pageMessage" class="message" role="status">正在连接你的记录…</p><section id="appSection" class="hidden"><nav class="health-tabs" aria-label="健康记录类型"><button type="button" data-personal-tab="weight" aria-selected="true">体重与趋势</button><button type="button" data-personal-tab="exercise" aria-selected="false">锻炼与汇总</button></nav><div id="personal-weight" class="personal-grid" style="margin-top:20px">
          <form class="card" data-personal-form="weight">
            <h3>记录体重</h3>
            <div class="field"><label for="weightDate">日期</label><input id="weightDate" name="entry_date" type="date" required /></div>
            <div class="inline-fields"><div class="field"><label for="weightValue">体重</label><input id="weightValue" name="weight" type="number" min="1" step="0.001" required /></div><div class="field"><label for="weightUnit">单位</label><select id="weightUnit" name="unit"><option value="kg">kg</option><option value="lb">lb</option></select></div></div>
            <div class="field"><label for="weightNote">备注（可选）</label><textarea id="weightNote" name="note" maxlength="1000"></textarea></div>
            <div class="btn-row"><button class="primary">保存体重</button><button type="button" class="secondary" data-personal-clear="weight">新建</button></div>
            <p class="small" data-personal-message="weight" role="status"></p>
          </form>
          <div class="card"><h3>趋势与历史</h3><p class="small">每天取最后录入的一条绘制趋势；切换单位只改变显示。</p><svg id="weightChart" role="img" aria-label="体重趋势图" viewBox="0 0 600 230"></svg><div class="personal-list" data-personal-list="weight"></div></div>
        </div>
        <div id="personal-exercise" class="personal-grid hidden" style="margin-top:20px">
          <form class="card" data-personal-form="exercise">
            <h3>记录锻炼</h3>
            <div class="field"><label for="exerciseDate">日期</label><input id="exerciseDate" name="entry_date" type="date" required /></div>
            <div class="field"><label for="exerciseType">运动类型</label><input id="exerciseType" name="activity_type" maxlength="80" placeholder="例如：跑步" required /></div>
            <div class="field"><label for="exerciseMinutes">时长（分钟）</label><input id="exerciseMinutes" name="duration_minutes" type="number" min="1" max="1440" step="1" required /></div>
            <div class="field"><label for="exerciseNote">备注（可选）</label><textarea id="exerciseNote" name="note" maxlength="1000"></textarea></div>
            <div class="btn-row"><button class="primary">保存锻炼</button><button type="button" class="secondary" data-personal-clear="exercise">新建</button></div>
            <p class="small" data-personal-message="exercise" role="status"></p>
          </form>
          <div class="card"><h3>汇总与历史</h3><div class="inline-fields"><div><label for="exercisePeriod">周期</label><select id="exercisePeriod"><option value="week">按周</option><option value="month">按月</option></select></div><div><label for="exerciseAnchor">所在日期</label><input id="exerciseAnchor" type="date" /></div></div><p id="exerciseSummary" class="small"></p><div class="personal-list" data-personal-list="exercise"></div></div>
        </div><p class="small">记录仅当前账号可查看。趋势展示最近 30 个有记录的日期。</p></section><footer><span>GARYHUB / YOUR PERSONAL SPACE.</span><a href="/journal/">去写日记 →</a></footer></main><script src="/ambient.js"></script><script src="/workspace.js"></script><script src="/health-page.js"></script></body></html>
