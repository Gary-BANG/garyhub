<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请账号 · GaryHub</title><script src="/theme.js"></script><link rel="stylesheet" href="/auth-hub.css"></head><body class="auth-page" data-auth="register"><canvas id="sky" aria-hidden="true"></canvas><nav><a class="brand" href="https://tools.garyhub.uk">Gary<i>Hub.</i></a><div class="nav-right"><a href="https://tools.garyhub.uk">← All tools</a><button class="theme" aria-label="切换明暗主题">◐</button></div></nav><main class="wrap login-wrap register-wrap"><section class="login-intro"><span class="eyebrow">GARYHUB / YOUR EVERYDAY COMPANION</span><h1>Make room.<br>For <em>your days.</em></h1><p>让计划、心情与每一步成长，都有一个安放的地方。</p><div class="divider"></div></section><section class="login-card"><h2>Start here.</h2><p>提交申请后，由管理员审核开通。</p><form id="authForm"><label for="username">USERNAME / 用户名</label><input id="username" autocomplete="username" required maxlength="32" minlength="3" pattern="[a-zA-Z0-9_.\-]+"><label for="password">PASSWORD / 密码</label><input id="password" type="password" autocomplete="new-password" minlength="6" required><label for="confirmPassword">CONFIRM PASSWORD / 确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><label for="note">A LITTLE ABOUT YOU / 申请备注</label><textarea id="note" maxlength="500" placeholder="告诉我们你是谁，方便管理员审核"></textarea><div id="registrationEmailFields" class="hidden"><label for="email">EMAIL / 邮箱</label><input id="email" type="email" autocomplete="email"><button id="sendCode" class="auth-action" type="button">发送验证码</button><label for="code">VERIFICATION CODE / 验证码</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="confirmCode" class="auth-action" type="button">验证邮箱</button><p id="emailMessage" class="message" role="status"></p></div><button id="submitAuth" class="submit" type="submit">提交注册申请 →</button><div id="message" role="status"></div></form><a class="login-link" href="/login/">已有账号？返回登录</a><p class="footnote">一个账号，连接你的日历、日记与健康记录。</p></section></main><script src="/ambient.js"></script><script src="/auth-page.js"></script></body></html>
