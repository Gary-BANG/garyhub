services:
  lab:
    image: garyhub-lab:20261007-v1
    container_name: garyhub-lab
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://lab.garyhub.uk
      CALENDAR_URL: http://calendar-app:3000
      LAB_DATA_DIR: /data
      # Set this to the HTTPS address of the store homepage after verification.
      ACCESS_STORE_URL: ""
      ACCESS_RUNTIME_FILE: /access-runtime/status.json
      ACCESS_SUB_ORIGIN: https://vpn.garyhub.uk
    volumes:
      - /opt/my-services/lab-data:/data
      - /opt/garyhub-access/runtime:/access-runtime:ro
    networks:
      - services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  services:
    external: true
    name: my-services_default
