services:
  lab:
    image: garyhub-lab:20261007-v1
    container_name: garyhub-lab
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://lab.garyhub.uk
      CALENDAR_URL: http://calendar-app:3000
      LAB_DATA_DIR: /data
    volumes:
      - /opt/my-services/lab-data:/data
    networks:
      - services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  services:
    external: true
    name: my-services_default
