<script>
const menus=[...document.querySelectorAll('.dropdown')];
function setOpen(menu,open){menu.querySelector('button').setAttribute('aria-expanded',String(open));menu.querySelector('.panel').hidden=!open;}
function closeAll(except){menus.forEach(menu=>{if(menu!==except)setOpen(menu,false);});}
menus.forEach(menu=>{const button=menu.querySelector('button');button.addEventListener('click',()=>{const open=button.getAttribute('aria-expanded')!=='true';closeAll(menu);setOpen(menu,open);});menu.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse'){closeAll(menu);setOpen(menu,true);}});menu.addEventListener('pointerleave',event=>{if(event.pointerType==='mouse'&&!menu.contains(document.activeElement))setOpen(menu,false);});menu.addEventListener('focusout',()=>setTimeout(()=>{if(!menu.contains(document.activeElement))setOpen(menu,false);},0));menu.addEventListener('keydown',event=>{if(event.key==='Escape'){setOpen(menu,false);button.focus();}if(event.key==='ArrowDown'&&event.target===button){event.preventDefault();closeAll(menu);setOpen(menu,true);menu.querySelector('.panel a').focus();}});menu.querySelectorAll('.panel a').forEach(link=>link.addEventListener('click',()=>setOpen(menu,false)));});
document.addEventListener('click',event=>{if(!event.target.closest('.dropdown'))closeAll();});
</script><script src="/hub-account.js"></script><dialog id="profileDialog"><form id="profileForm"><h2>查看完整资料</h2><p>请输入管理员提供的资料访问码。授权默认有效 24 小时。</p><label for="profileCode">资料访问码</label><input id="profileCode" type="password" autocomplete="off" minlength="8" maxlength="128" required><p id="profileError" role="status"></p><div class="profile-actions"><button type="button" id="profileCancel">取消</button><button type="submit">解锁资料</button></div></form></dialog><script src="/profile-privacy.js"></script></body></html>
