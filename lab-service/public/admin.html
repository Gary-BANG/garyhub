<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · GaryHub</title><link rel="stylesheet" href="/hub.css"><link rel="stylesheet" href="/hub-account.css"><style>.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.manage-panel{background:var(--card,#fffdf8);border:1px solid var(--line,#e2d7c9);padding:28px;border-radius:16px}.manage-row{padding:20px 0;border-top:1px solid #e4d9cc}.manage-row small{display:block;margin:8px 0;color:#887663}.manage-row label{display:block;margin-top:14px}.manage-row button{margin:12px 8px 0 0}.manage-row h3{margin:0}.manage-row p{overflow-wrap:anywhere}.manage-row input[type=checkbox]{accent-color:#a76b38;width:18px;height:18px;margin:0;padding:0;flex:none}.manage-row label{display:flex;align-items:center;gap:8px}.manage-grid[hidden]{display:none}@media(max-width:760px){.manage-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/profile-privacy.css"></head><body><nav><a class="brand" href="https://tools.garyhub.uk">Gary<i>Hub.</i></a><div class="nav-right"><a href="https://tools.garyhub.uk">所有工具</a><a href="https://calendar.garyhub.uk">Calendar</a></div><div data-hub-account data-required="true"></div></nav><main class="wrap"><section class="hero"><span class="eyebrow">TOOLS / ADMINISTRATION</span><h1>管理账号，<br><em>从这里开始。</em></h1><p>审批注册申请，为指定用户开放主页学业信息。</p><button class="gh-button" id="refresh-users">刷新列表</button><p id="admin-status" role="status"></p></section><section class="manage-grid" id="admin-content" hidden><article class="manage-panel"><h2>注册审批</h2><div id="requests"></div></article><article class="manage-panel"><h2>主页查看权限</h2><p>新用户默认隐藏 GPA 和 Rank；管理员始终可见。</p><div id="users"></div></article><article id="profilePrivacy" class="manage-panel privacy-admin" hidden><span class="eyebrow">HOMEPAGE / PRIVACY</span><h2>个人资料访问控制</h2><p>启用保护时，路人和普通登录用户需访问码查看受保护资料。原有指定用户的 GPA / Rank 权限继续有效，管理员始终可以查看。</p><form id="privacyForm"><label><input id="privacyRequired" type="checkbox">启用资料保护（取消勾选则所有人可直接查看完整资料）</label><fieldset><legend>需要保护的内容</legend><label><input type="checkbox" data-privacy-key="identity">姓名、中文署名与 GitHub 身份链接</label><label><input type="checkbox" data-privacy-key="education">学校、学位、毕业时间、交换经历与教育简介</label><label><input type="checkbox" data-privacy-key="academics">GPA 与 Rank</label><label><input type="checkbox" data-privacy-key="projects">研究与项目经历</label><label><input type="checkbox" data-privacy-key="skills">技能与兴趣</label></fieldset><label for="privacyCode">设置新访问码（留空保留原码）</label><input id="privacyCode" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="8–128 个字符"><p class="small">访问码不回显。每次解锁有效 24 小时；修改设置或访问码会撤销旧授权。</p><div class="privacy-actions"><button class="gh-button">保存资料保护设置</button><button type="button" id="privacyRevoke" class="gh-button">撤销已有访客授权</button><a class="gh-button" target="_blank" rel="noopener" href="https://garyhub.uk/?preview=visitor">预览未授权首页 ↗</a></div></form><p id="privacyStatus" role="status"></p></article></section></main><script src="/hub-account.js"></script><script src="/admin.js"></script><script src="/profile-admin.js"></script></body></html>
