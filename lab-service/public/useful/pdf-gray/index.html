<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 浅灰转换器 · GaryHub</title><script src="/i18n/dictionary.js"></script><script src="/useful/tool-i18n.js"></script><script src="/i18n/i18n.js"></script><link rel="stylesheet" href="/i18n/i18n.css"><link rel="stylesheet" href="../tool-shell.css"><link rel="stylesheet" href="style.css"></head><body><main><div class="heading"><span class="eyebrow">USEFUL TOOLS / PRINTING</span><h1>PDF 浅灰转换器</h1><p>把深色内容调浅，为打印准备一份新文件。<br><span>PDF light-gray converter · Local processing</span></p></div><div class="layout"><section class="panel"><h2>01 / 选择文件</h2><label class="file" for="pdf-file">选择 PDF 或拖到这里<input id="pdf-file" type="file" accept="application/pdf,.pdf"></label><p id="pdf-info">文件不会上传到服务器。最多 20 MB、100 页。</p><h2>02 / 调整输出</h2><label for="pdf-mode">输出颜色</label><select id="pdf-mode"><option value="color">偏彩色浅灰 / Tinted gray</option><option value="neutral">纯灰色 / Neutral gray</option></select><label for="pdf-level">深浅 <output id="pdf-level-value">105</output><small>数值越大，深色内容越浅</small></label><input id="pdf-level" type="range" min="0" max="220" value="105"><label for="pdf-dpi">清晰度</label><select id="pdf-dpi"><option value="150">150 DPI</option><option value="200" selected>200 DPI</option><option value="300">300 DPI</option></select><div class="actions"><button id="pdf-preview" disabled>预览第一页</button><button id="pdf-convert" class="primary" disabled>转换并下载 PDF</button><button id="pdf-cancel" hidden>取消处理</button></div><progress id="pdf-progress" max="100" value="0" hidden></progress><p id="pdf-status" role="status" aria-live="polite">选择 PDF 开始。</p></section><section class="panel preview"><h2>03 / 效果预览</h2><div class="canvases"><figure><figcaption>原图 / Original</figcaption><canvas id="pdf-original"></canvas></figure><figure><figcaption>转换后 / Converted</figcaption><canvas id="pdf-result"></canvas></figure></div><p class="note">保留页面尺寸与显示方向，导出为图片型 PDF；文字不再可选中，链接和表单交互不保留。偏彩色浅灰不能保证打印机使用彩色墨盒。原文件不受影响。</p></section></div></main><script src="../tool-shell.js"></script><script src="../vendor/pdf-lib.min.js"></script><script type="module" src="app.js"></script></body></html>
