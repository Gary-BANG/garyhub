<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Logs · GaryHub</title><link rel="stylesheet" href="/hub.css"><link rel="stylesheet" href="/hub-account.css"><link rel="stylesheet" href="/ai-logs/logs.css?v=2.3.2.3"></head><body><canvas id="sky" aria-hidden="true"></canvas><nav><a class="brand" href="/">Gary<i>Hub.</i></a><div class="nav-right"><a href="/">Tools</a><a href="/admin/">用户管理</a><button class="theme" aria-label="切换明暗主题">◐</button></div></nav><main class="wrap"><div data-hub-account data-required="true"></div><section class="hero"><p class="eyebrow">ADMINISTRATOR / AI ASSISTANT</p><h1>AI <em>Logs.</em></h1><p>每条消息用了哪个模型、计了哪些次数，以及所有失败原因。</p></section><div class="logs-toolbar"><p id="message" role="status">正在读取记录…</p><button id="refresh" type="button">刷新</button></div><div id="content" hidden><section id="overview" class="metrics-grid" aria-label="最近 24 小时概况"></section><section class="logs-card"><h2>按用户 <small>最近 24 小时</small></h2><div id="people" class="table-scroll"></div></section><section class="logs-card"><div class="card-head"><h2>调用记录</h2><label>结果 <select id="outcome"><option value="">全部</option><option value="ok">成功</option><option value="limited">达到上限</option><option value="error">失败</option></select></label></div><div id="calls" class="table-scroll"></div><button id="moreCalls" class="more" type="button" hidden>加载更早的记录</button></section><section class="logs-card"><div class="card-head"><h2>错误日志</h2><label>来源 <select id="source"><option value="">全部</option><option value="chat">模型调用</option><option value="search">联网搜索</option><option value="test">测试连接</option><option value="confirm">确认操作</option></select></label></div><div id="errors" class="table-scroll"></div><button id="moreErrors" class="more" type="button" hidden>加载更早的错误</button></section><p class="muted">只记录元数据（时间、账号、模型、次数、Token、错误代码），不保存对话内容；记录保留 30 天。“已恢复”表示主模型失败后备用模型完成了这条消息。</p></div><footer><span>GARYHUB / AI LOGS.</span><span>v2.3.0.3</span></footer></main><script src="/hub.js"></script><script src="/hub-account.js"></script><script src="/ai-logs/logs.js?v=2.3.2.3"></script></body></html>
