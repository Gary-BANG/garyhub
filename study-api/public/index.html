<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner - Gary Hub</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      color: var(--primary);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 16px;
    }

    .sync-status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(229, 231, 235, 0.9);
    }

    .form-card {
      padding: 24px;
      position: sticky;
      top: 24px;
    }

    .form-card h2,
    .list-card h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 650;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      background: var(--primary);
      color: #fff;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 10px;
      background: #f3f4f6;
      color: #374151;
    }

    .secondary-btn:hover {
      background: #e5e7eb;
    }

    .toolbar {
      display: grid;
      gap: 16px;
      margin-bottom: 18px;
    }

    .toolbar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-title-row h2 {
      margin: 0;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .filter-item label {
      margin: 0 0 7px;
      font-size: 13px;
      color: var(--muted);
    }

    .filter-item input,
    .filter-item select {
      min-height: 48px;
    }

    @media (max-width: 980px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .toolbar-title-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    .list-card {
      padding: 24px;
    }

    .task-list {
      display: grid;
      gap: 14px;
    }

    .task {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      background: #fff;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .task-title {
      font-size: 19px;
      font-weight: 800;
      margin: 0;
    }

    .task-date {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 750;
    }

    .badge.todo {
      background: #fee2e2;
      color: var(--red);
    }

    .badge.doing {
      background: #fef3c7;
      color: var(--yellow);
    }

    .badge.done {
      background: #dcfce7;
      color: var(--green);
    }

    .task-meta {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0;
    }

    .task-note {
      line-height: 1.65;
      margin: 12px 0 0;
      color: #374151;
      white-space: pre-wrap;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .small-btn {
      padding: 8px 10px;
      font-size: 13px;
      background: #f3f4f6;
      color: #374151;
    }

    .delete-btn {
      background: #fee2e2;
      color: var(--red);
    }

    .empty,
    .error-box {
      text-align: center;
      color: var(--muted);
      padding: 52px 20px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fafafa;
    }

    .error-box {
      color: var(--red);
      border-color: #fecaca;
      background: #fff1f2;
    }

    @media (max-width: 880px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .form-card {
        position: static;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1>Study Planner</h1>
        <div class="subtitle">UIUC 学习计划 · 论文阅读 · Benchmark · Todo List</div>
        <div class="sync-status" id="syncStatus">正在连接服务器...</div>
      </div>
      <a class="back-link" href="/">← 返回 Gary Hub</a>
    </div>

    <section class="layout">
      <form class="card form-card" id="taskForm">
        <h2 id="formTitle">新增学习任务</h2>

        <label for="title">学习内容</label>
        <input id="title" name="title" placeholder="例如：学习 DiT" required />

        <div class="date-row">
          <div>
            <label for="startDate">开始日期</label>
            <input id="startDate" name="startDate" type="date" required />
          </div>
          <div>
            <label for="endDate">结束日期</label>
            <input id="endDate" name="endDate" type="date" required />
          </div>
        </div>

        <label for="category">分类</label>
        <select id="category" name="category">
          <option value="Course">Course</option>
          <option value="Paper">Paper</option>
          <option value="Benchmark">Benchmark</option>
          <option value="Coding">Coding</option>
          <option value="Research">Research</option>
          <option value="Other">Other</option>
        </select>

        <label for="status">状态</label>
        <select id="status" name="status">
          <option value="todo">未开始</option>
          <option value="doing">进行中</option>
          <option value="done">已完成</option>
        </select>

        <label for="note">备注</label>
        <textarea id="note" name="note" placeholder="例如：阅读论文、整理公式、跑 FIBO benchmark、总结可视化指标。"></textarea>

        <button class="primary-btn" id="submitBtn" type="submit">添加任务</button>
        <button class="secondary-btn" id="cancelEditBtn" type="button" hidden>取消编辑</button>
      </form>

      <section class="card list-card">
        <div class="toolbar">
          <div class="toolbar-title-row">
            <h2>学习任务</h2>
            <button class="small-btn" id="clearFilters" type="button">清空筛选</button>
          </div>

          <div class="filters">
            <div class="filter-item">
              <label for="filterStatus">状态</label>
              <select id="filterStatus">
                <option value="all">全部状态</option>
                <option value="todo">未开始</option>
                <option value="doing">进行中</option>
                <option value="done">已完成</option>
              </select>
            </div>

            <div class="filter-item">
              <label for="filterCategory">分类</label>
              <select id="filterCategory">
                <option value="all">全部分类</option>
                <option value="Course">Course</option>
                <option value="Paper">Paper</option>
                <option value="Benchmark">Benchmark</option>
                <option value="Coding">Coding</option>
                <option value="Research">Research</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="filter-item">
              <label for="filterStartDate">筛选开始日期</label>
              <input id="filterStartDate" type="date" />
            </div>

            <div class="filter-item">
              <label for="filterEndDate">筛选结束日期</label>
              <input id="filterEndDate" type="date" />
            </div>
          </div>
        </div>

        <div class="task-list" id="taskList"></div>
      </section>
    </section>
  </main>

  <script>
    const API_BASE = "/api/study";
    const OLD_STORAGE_KEY = "garyhub_study_planner_tasks_v1";
    const MIGRATION_KEY = "garyhub_study_planner_migrated_v2";

    const statusText = {
      todo: "未开始",
      doing: "进行中",
      done: "已完成"
    };

    const statusClass = {
      todo: "todo",
      doing: "doing",
      done: "done"
    };

    const form = document.getElementById("taskForm");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const taskList = document.getElementById("taskList");
    const filterStatus = document.getElementById("filterStatus");
    const filterCategory = document.getElementById("filterCategory");
    const filterStartDate = document.getElementById("filterStartDate");
    const filterEndDate = document.getElementById("filterEndDate");
    const clearFilters = document.getElementById("clearFilters");
    const syncStatus = document.getElementById("syncStatus");

    let tasks = [];
    let editingTaskId = null;

    async function request(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "服务器请求失败");
      }

      return data;
    }

    function setSyncStatus(text) {
      syncStatus.textContent = text;
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      const date = new Date(dateString + "T00:00:00");
      return date.toLocaleDateString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function matchesDateRange(task, filterStart, filterEnd) {
      const taskStart = task.startDate || "";
      const taskEnd = task.endDate || taskStart;

      if (!filterStart && !filterEnd) return true;

      if (filterStart && !filterEnd) {
        return taskEnd >= filterStart;
      }

      if (!filterStart && filterEnd) {
        return taskStart <= filterEnd;
      }

      return taskStart <= filterEnd && taskEnd >= filterStart;
    }

    async function migrateLocalStorageOnce() {
      if (localStorage.getItem(MIGRATION_KEY)) return;

      let oldTasks = [];

      try {
        oldTasks = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)) || [];
      } catch {
        oldTasks = [];
      }

      if (oldTasks.length > 0) {
        await request("/tasks/import", {
          method: "POST",
          body: JSON.stringify({ tasks: oldTasks })
        });
      }

      localStorage.setItem(MIGRATION_KEY, "1");
    }

    async function loadTasks() {
      setSyncStatus("正在同步服务器数据...");

      try {
        await migrateLocalStorageOnce();
        const data = await request("/tasks");
        tasks = data.tasks || [];
        setSyncStatus("已同步到服务器 · 数据保存在 VPS");
        renderTasks();
      } catch (error) {
        taskList.innerHTML = `<div class="error-box">连接服务器失败：${escapeHtml(error.message)}</div>`;
        setSyncStatus("同步失败，请检查 study-api 和 Caddy 配置");
      }
    }

    function renderTasks() {
      const currentStatus = filterStatus.value;
      const currentCategory = filterCategory.value;
      const currentStartDate = filterStartDate.value;
      const currentEndDate = filterEndDate.value;

      if (currentStartDate && currentEndDate && currentEndDate < currentStartDate) {
        taskList.innerHTML = '<div class="error-box">筛选结束日期不能早于筛选开始日期。</div>';
        return;
      }

      const visibleTasks = tasks
        .filter(task => currentStatus === "all" || task.status === currentStatus)
        .filter(task => currentCategory === "all" || task.category === currentCategory)
        .filter(task => matchesDateRange(task, currentStartDate, currentEndDate))
        .sort((a, b) => {
          if (a.startDate === b.startDate) return b.createdAt - a.createdAt;
          return a.startDate.localeCompare(b.startDate);
        });

      if (visibleTasks.length === 0) {
        taskList.innerHTML = '<div class="empty">还没有学习任务。先添加一个，比如：6月23日 - 6月25日学习 DiT。</div>';
        return;
      }

      taskList.innerHTML = visibleTasks.map(task => `
        <article class="task">
          <div class="task-header">
            <div>
              <h3 class="task-title">${escapeHtml(task.title)}</h3>
              <div class="task-date">${formatDate(task.startDate)} - ${formatDate(task.endDate)}</div>
            </div>
            <span class="badge ${statusClass[task.status]}">${statusText[task.status]}</span>
          </div>

          <div class="task-meta">分类：${escapeHtml(task.category)}</div>
          ${task.note ? `<p class="task-note">${escapeHtml(task.note)}</p>` : ""}

          <div class="task-actions">
            <button class="small-btn" onclick="startEditTask('${task.id}')">编辑</button>
            <button class="small-btn" onclick="changeStatus('${task.id}', 'todo')">未开始</button>
            <button class="small-btn" onclick="changeStatus('${task.id}', 'doing')">进行中</button>
            <button class="small-btn" onclick="changeStatus('${task.id}', 'done')">已完成</button>
            <button class="small-btn delete-btn" onclick="deleteTask('${task.id}')">删除</button>
          </div>
        </article>
      `).join("");
    }

    function enterCreateMode() {
      editingTaskId = null;
      form.reset();
      formTitle.textContent = "新增学习任务";
      submitBtn.textContent = "添加任务";
      cancelEditBtn.hidden = true;
      document.getElementById("status").value = "todo";
    }

    function startEditTask(id) {
      const task = tasks.find(item => item.id === id);

      if (!task) {
        alert("没有找到这个任务，可能已经被删除。");
        return;
      }

      editingTaskId = id;

      formTitle.textContent = "编辑学习任务";
      submitBtn.textContent = "保存修改";
      cancelEditBtn.hidden = false;

      document.getElementById("title").value = task.title || "";
      document.getElementById("startDate").value = task.startDate || "";
      document.getElementById("endDate").value = task.endDate || "";
      document.getElementById("category").value = task.category || "Other";
      document.getElementById("status").value = task.status || "todo";
      document.getElementById("note").value = task.note || "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function changeStatus(id, status) {
      try {
        await request(`/tasks/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify({ status })
        });
        await loadTasks();
      } catch (error) {
        alert(error.message);
      }
    }

    async function deleteTask(id) {
      if (!confirm("确定删除这个学习任务吗？")) return;

      try {
        await request(`/tasks/${encodeURIComponent(id)}`, {
          method: "DELETE"
        });

        if (editingTaskId === id) {
          enterCreateMode();
        }

        await loadTasks();
      } catch (error) {
        alert(error.message);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const formData = new FormData(form);
      const startDate = formData.get("startDate");
      const endDate = formData.get("endDate");

      if (endDate < startDate) {
        alert("结束日期不能早于开始日期。");
        return;
      }

      const payload = {
        title: formData.get("title").trim(),
        startDate,
        endDate,
        category: formData.get("category"),
        status: formData.get("status"),
        note: formData.get("note").trim()
      };

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = editingTaskId ? "正在保存..." : "正在添加...";

        if (editingTaskId) {
          await request(`/tasks/${encodeURIComponent(editingTaskId)}`, {
            method: "PATCH",
            body: JSON.stringify(payload)
          });
        } else {
          await request("/tasks", {
            method: "POST",
            body: JSON.stringify(payload)
          });
        }

        enterCreateMode();
        await loadTasks();
      } catch (error) {
        alert(error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editingTaskId ? "保存修改" : "添加任务";
      }
    });

    cancelEditBtn.addEventListener("click", enterCreateMode);

    [filterStatus, filterCategory, filterStartDate, filterEndDate].forEach(element => {
      element.addEventListener("change", renderTasks);
    });

    clearFilters.addEventListener("click", () => {
      filterStatus.value = "all";
      filterCategory.value = "all";
      filterStartDate.value = "";
      filterEndDate.value = "";
      renderTasks();
    });

    loadTasks();
  </script>
</body>
</html>
